name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Smoke repo-tracked Hermes postprocess operator
        run: |
          mkdir -p "$RUNNER_TEMP/lecture_recordings"/{02_transcripts,03_correction,04_summarize,05_prompt}
          python scripts/lecture_stt_postprocess_operator.py status \
            --repo-root "$PWD" \
            --lecture-root "$RUNNER_TEMP/lecture_recordings" \
            --hermes-bin /bin/false

      - name: Compile Python sources
        run: python -m compileall -q scripts src tests

  python-macos-smoke:
    name: macOS postprocess smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hermes postprocess hardening tests without live config
        run: python -m unittest tests.test_hermes_postprocess_hardening -v

      - name: Compile operator sources
        run: python -m compileall -q scripts/hermes_postprocess scripts/lecture_stt_postprocess_operator.py tests/test_hermes_postprocess_hardening.py

  web-panel:
    name: Web panel tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/web-panel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run web panel tests
        run: npm test

      - name: Build web panel
        run: npm run build
