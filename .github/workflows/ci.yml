name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON: python
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - &checkout
        name: Check out repository
        uses: actions/checkout@v4

      - &setup-python
        name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          make python-deps

      - name: Run unit tests
        run: make python-test

      - name: Compile Python sources
        run: make python-compile

  controller-readiness:
    name: Controller readiness
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - *checkout
      - *setup-python

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          cache-dependency-path: controller/go.sum

      - name: Prepare isolated project Python
        run: |
          python -m venv .venv
          make python-deps

      - name: Run controller Python contracts
        run: make controller-contracts

      - name: Run Go controller tests with race detector
        run: make controller-race

      - name: Repeat macOS controller shutdown regression tests
        run: make controller-sigterm

      - name: Vet Go controller
        run: make controller-vet

      - name: Run target-Darwin 20x100 acceptance gate
        run: make controller-darwin

  web-panel:
    name: Web panel tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - *checkout

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: make web-deps

      - name: Run web panel tests
        run: make web-test

      - name: Build web panel
        run: make web-build
