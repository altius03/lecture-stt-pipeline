# Copy to config/config.yaml and replace env-backed external paths for your machine.
# Repo-internal paths stay repo-relative.
app:
  polling_interval_sec: 10
  stable_for_sec: 90
  stale_processing_hours: 6
  transcribe_max_retries: 2

paths:
  watch_folder: "${LECTURE_RECORDINGS_ROOT}/00_inbox"
  stable_audio_folder: "${LECTURE_RECORDINGS_ROOT}/01_audio"
  transcript_folder: "${LECTURE_RECORDINGS_ROOT}/02_transcripts"
  error_folder: "${LECTURE_RECORDINGS_ROOT}/99_errors"
  tmp_dir: ~/Library/Caches/lecture_stt/tmp
  db_path: state/jobs.sqlite3

# Storage v2 remains separate from the live legacy jobs DB. The archive review
# API is opt-in, and every mutation still needs an explicit request guard.
storage_v2:
  db_path: state/storage-v2.sqlite3
  # Preserve-first imports reject a target nested under the legacy iCloud root.
  records_root: "~/Library/Application Support/lecture_stt/storage-v2/records"
  analytics:
    enabled: false
  library:
    enabled: false
  archive_review:
    enabled: false
    status_writes_enabled: false
    promotions_enabled: false
  timetable:
    # CSV/JSON import and classification generation remain CLI-only. These
    # flags expose imported metadata/reviews and explicit review writes only.
    enabled: false
    status_writes_enabled: false
    confirmations_enabled: false
  title_review:
    # Title proposals are generated separately; the web panel only exposes the
    # review queue plus explicit reject/confirmation guards.
    enabled: false
    status_writes_enabled: false
    confirmations_enabled: false

engine:
  engine: faster-whisper

transcribe:
  model_size: large-v3
  device: cpu
  compute_type: int8
  language: ko
  task: transcribe
  beam_size: 5
  vad_filter: false
  word_timestamps: false
  condition_on_previous_text: true
  keep_model_loaded: false

# 활성 프로필은 전사 실행 시점에 snapshot(key/version/hash)으로 기록된다.
# 일반 녹음을 기본값으로 두고, 강의/회의/메모는 필요할 때 active만 바꾼다.
profiles:
  active: general
  definitions:
    general:
      version: "2026-07-23.1"
      transcribe:
        initial_prompt: ""
      postprocess:
        corrections: {}
      quality:
        warn_threshold: 0.55
        bad_threshold: 0.70
    lecture:
      version: "2026-07-23.1"
      transcribe:
        initial_prompt: "한국어 대학 수업 녹음입니다."
      quality:
        warn_threshold: 0.55
        bad_threshold: 0.70
    meeting:
      version: "2026-07-23.1"
      transcribe:
        initial_prompt: "한국어 회의 및 대화 녹음입니다."
      postprocess:
        corrections: {}
      quality:
        warn_threshold: 0.55
        bad_threshold: 0.70
    memo:
      version: "2026-07-23.1"
      transcribe:
        initial_prompt: "한국어 개인 음성 메모입니다."
      postprocess:
        corrections: {}
      quality:
        warn_threshold: 0.55
        bad_threshold: 0.70

ffmpeg:
  binary_path: ffmpeg

logging:
  file: ~/Library/Logs/lecture_stt/app.log
  max_bytes: 10485760
  backup_count: 5

cleanup:
  retain_days: 7
  retain_min_transcripts: 5

correction:
  prompt_folder: "${LECTURE_RECORDINGS_ROOT}/05_prompt"
  mode: manual  # API-backed automatic correction is disabled; use manual/provider-neutral correction.
  stable_for_sec: 60
  scan_interval_sec: 60

notification:
  provider: telegram
  enabled: true
  send_start: true
  send_success: true
  send_review: true
  send_failure: true
  dual_send_providers: []

downstream:
  scan_interval_sec: 30
  stable_for_sec: 60
  correction_folder: "${LECTURE_RECORDINGS_ROOT}/03_correction"
  summary_folder: "${LECTURE_RECORDINGS_ROOT}/04_summarize"
  gh_current_semester_root: "${GH_CURRENT_SEMESTER_ROOT}"
  obsidian_semester_root: "${OBSIDIAN_SEMESTER_ROOT}"
  log_jsonl_path: ~/Library/Logs/lecture_stt/downstream.jsonl
  log_jsonl_max_bytes: 10485760
  log_jsonl_backup_count: 5
  stats_heartbeat_scans: 120
  log_suppression_max_keys: 4096
  log_routine_scan_events: false
  lock_path: state/downstream.lock
  subjects:
    LC:
      gh_course_dir: "01_logic_circuits"
      obsidian_course_dir: "01_logic_circuits"
      display_name: "논리회로"
      obsidian_note_dir: "06_lecture_notes/01_summarize"
    DStr:
      gh_course_dir: "02_data_structures"
      obsidian_course_dir: "02_data_structures"
      display_name: "자료구조"
      obsidian_note_dir: "06_lecture_notes/01_summarize"
    DS:
      gh_course_dir: "03_data_science"
      obsidian_course_dir: "03_data_science"
      display_name: "데이터사이언스"
      obsidian_note_dir: "06_lecture_notes/01_summarize"
    LA:
      gh_course_dir: "04_linear_algebra"
      obsidian_course_dir: "04_linear_algebra"
      display_name: "선형대수학"
      obsidian_note_dir: "06_lecture_notes/01_summarize"
    OOP:
      gh_course_dir: "05_object_oriented_programming"
      obsidian_course_dir: "05_object_oriented_programming"
      display_name: "객체지향언어"
      obsidian_note_dir: "06_lecture_notes/01_summarize"
    Unix:
      gh_course_dir: "06_unix_fundamentals"
      obsidian_course_dir: "06_unix_fundamentals"
      display_name: "유닉스 기초"
      obsidian_note_dir: "06_lecture_notes/01_summarize"
