# Copy to config/config.yaml and replace env-backed external paths for your machine.
# Repo-internal paths stay repo-relative.
app:
  polling_interval_sec: 10
  stable_for_sec: 90
  stale_processing_hours: 6

paths:
  watch_folder: "${LECTURE_RECORDINGS_ROOT}/00_inbox"
  stable_audio_folder: "${LECTURE_RECORDINGS_ROOT}/01_audio"
  transcript_folder: "${LECTURE_RECORDINGS_ROOT}/02_transcripts"
  error_folder: "${LECTURE_RECORDINGS_ROOT}/99_errors"
  tmp_dir: tmp
  db_path: state/jobs.sqlite3

engine:
  engine: faster-whisper

transcribe:
  model_size: large-v3
  device: cpu
  compute_type: int8
  language: ko
  task: transcribe
  beam_size: 5
  vad_filter: false
  word_timestamps: false
  condition_on_previous_text: true
  keep_model_loaded: false

ffmpeg:
  binary_path: ffmpeg

logging:
  file: logs/app.log
  max_bytes: 5242880
  backup_count: 5

cleanup:
  retain_days: 7
  retain_min_transcripts: 5

correction:
  prompt_folder: "${LECTURE_RECORDINGS_ROOT}/05_prompt"
  model: claude-haiku-4-5-20251001  # claude-sonnet-4-6 으로 교체하면 정확도 향상
  max_tokens: 8192
  stable_for_sec: 60
  scan_interval_sec: 60
  # api_key: "<ANTHROPIC_API_KEY>"  # .env에 ANTHROPIC_API_KEY로 설정하는 것을 권장

notification:
  provider: telegram
  enabled: true
  send_start: true
  send_success: true
  send_failure: true
  dual_send_providers: []

downstream:
  scan_interval_sec: 30
  stable_for_sec: 60
  correction_folder: "${LECTURE_RECORDINGS_ROOT}/03_correction"
  summary_folder: "${LECTURE_RECORDINGS_ROOT}/04_summarize"
  gh_current_semester_root: "${GH_CURRENT_SEMESTER_ROOT}"
  obsidian_semester_root: "${OBSIDIAN_SEMESTER_ROOT}"
  log_jsonl_path: state/logs/downstream.jsonl
  lock_path: state/downstream.lock
  subjects:
    LC:
      gh_course_dir: "01_logic_circuits"
      obsidian_course_dir: "01_logic_circuits"
      display_name: "논리회로"
      obsidian_note_dir: "강의록"
    DStr:
      gh_course_dir: "02_data_structures"
      obsidian_course_dir: "02_data_structures"
      display_name: "자료구조"
      obsidian_note_dir: "강의록"
    DS:
      gh_course_dir: "03_data_science"
      obsidian_course_dir: "03_data_science"
      display_name: "데이터사이언스"
      obsidian_note_dir: "강의록"
    LA:
      gh_course_dir: "04_linear_algebra"
      obsidian_course_dir: "04_linear_algebra"
      display_name: "선형대수학"
      obsidian_note_dir: "강의록"
    OOP:
      gh_course_dir: "05_object_oriented_programming"
      obsidian_course_dir: "05_object_oriented_programming"
      display_name: "객체지향언어"
      obsidian_note_dir: "강의록"
    Unix:
      gh_course_dir: "06_unix_fundamentals"
      obsidian_course_dir: "06_unix_fundamentals"
      display_name: "유닉스 기초"
      obsidian_note_dir: "강의록"
